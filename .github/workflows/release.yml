name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18.x"

      - name: Build plugin
        run: |
          npm install
          npm run build

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          # A semver prerelease tag (3.6.0-alpha, 3.6.0-beta.2, …) must be
          # published as a prerelease. GitHub shows the newest NON-prerelease as
          # "Latest release", so without this an alpha becomes the shop window
          # and anyone landing on the repo is offered it as the stable build.
          prerelease=""
          case "$tag" in
            *-*) prerelease="--prerelease" ;;
          esac

          if gh release view "$tag" &>/dev/null; then
            gh release upload "$tag" \
              main.js manifest.json styles.css --clobber
          else
            gh release create "$tag" \
              --title="$tag" \
              --generate-notes \
              $prerelease \
              main.js manifest.json styles.css
          fi
