name: Release Obsidian plugin

on:
  push:
    tags:
      - "*"

permissions:
  contents: write
  # Build provenance attestations for the release assets.
  id-token: write
  attestations: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Validate tag and stage manifest
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          node scripts/stage-release-manifest.mjs "$tag" "$RUNNER_TEMP/release-manifest"

      - name: Build plugin
        run: |
          npm ci
          npm run build

      - name: Verify release candidate before publishing
        run: |
          npm run lint
          npm run svelte-check -- --fail-on-warnings
          npm test -- --runInBand
          node scripts/check-docs-site.mjs
          node scripts/test-docs-site.mjs

      # Lets anyone verify that main.js and styles.css were built from this
      # repository (`gh attestation verify main.js -R ParkPavel/obs-projects-plus`);
      # the community directory recommends it.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create or update release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          manifest="$RUNNER_TEMP/release-manifest/manifest.json"

          # Only x.y.z-beta.N is a prerelease (BRAT channel). GitHub shows the
          # newest NON-prerelease as "Latest release", so a beta must not be it.
          prerelease="--prerelease=false"
          if [[ "$tag" =~ -beta\.[0-9]+$ ]]; then
            prerelease="--prerelease"
          fi

          if gh release view "$tag" &>/dev/null; then
            # A rerun also corrects the release's own metadata: BRAT needs the
            # release name to equal the tag, and only a beta may be a prerelease.
            gh release edit "$tag" --title="$tag" "$prerelease"
            gh release upload "$tag" \
              main.js "$manifest" styles.css --clobber
          else
            gh release create "$tag" \
              --title="$tag" \
              --generate-notes \
              "$prerelease" \
              main.js "$manifest" styles.css
          fi
