name: Bug Report
description: Report a problem with Projects Plus
labels: ["kind/bug", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: |
        Describe the problem and include any visible error code. Remove private note content from examples.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Start with the view you opened, then list the actions that caused the problem.
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Anything else we need to know?

  - type: input
    id: pluginVersion
    attributes:
      label: Plugin version
      description: Open Settings -> Community plugins -> Installed plugins -> Projects Plus.
    validations:
      required: true

  - type: input
    id: obsidianVersion
    attributes:
      label: Obsidian version
      description: You can find the version under Settings -> General -> Current version.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: OS
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - Other
    validations:
      required: true
